{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Something went wrong · KL-CIIE</title>
<link rel="icon" type="image/png" href="{% static 'img/favicon-32.png' %}">
<style>
  @font-face { font-family: "Geist"; src: url("{% static 'fonts/Geist-Variable.woff2' %}") format("woff2"); font-weight: 100 900; }
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: "Geist", system-ui, sans-serif; background: #fdf0d5; color: #003049; padding: 24px; text-align: center; }
  @media (prefers-color-scheme: dark) { body { background: #001b29; color: #fdf0d5; } p { color: #93a9b6 !important; } }
  .shapes { display: flex; gap: 12px; justify-content: center; margin-bottom: 32px; }
  .shapes span { width: 64px; height: 64px; display: block; }
  .s1 { background: #c1121f; border-radius: 12px; transform: rotate(14deg); }
  .s2 { border: 16px solid #669bbc; border-radius: 50%; box-sizing: border-box; }
  .s3 { background: currentColor; border-radius: 50%; }
  h1 { font-size: 32px; line-height: 38px; font-weight: 700; letter-spacing: -0.04em; margin: 0 0 12px; }
  p { color: #4c6a73; font-size: 18px; line-height: 28px; max-width: 440px; margin: 0 auto 32px; }
  a.btn { display: inline-block; background: #c1121f; color: #fff8ea; text-decoration: none; font-weight: 600; padding: 12px 24px; border-radius: 999px; }
</style>
</head>
<body>
  <main>
    <div class="shapes" aria-hidden="true"><span class="s1"></span><span class="s2"></span><span class="s3"></span></div>
    <h1>Something went wrong on our side</h1>
    <p>Please try again in a minute. If it keeps happening, tell the event team at klciie@kluniversity.in.</p>
    <a class="btn" href="/">Back to the home page</a>
  </main>
</body>
</html>
