[project]
name = "kl-ciie-portal"
version = "0.1.0"
description = "KL-CIIE event portal: registration, passes, door check-in and results for one event a year"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-allauth[socialaccount]>=65.22.1",
    "django-anymail>=15.2",
    "django-environ>=0.14.0",
    "django-pghistory>=3.9.2",
    "gunicorn>=27.0.1",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.9",
    "segno>=1.6.6",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q --reuse-db"
