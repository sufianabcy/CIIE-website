# Production stack on the server, at /opt/klciie/compose.yml (copied on every deploy).
# Settings and secrets come from /opt/klciie/.env on the server.
#
#   caddy   HTTPS and reverse proxy; the only service open to the internet (80, 443)
#   web     the Django site (gunicorn); runs migrations as it starts
#   worker  email queue and hourly encrypted backups
#   db      PostgreSQL 17, data on the "pgdata" volume

name: klciie

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: ${IMAGE:-ghcr.io/sufianabcy/ciie-website}:${IMAGE_TAG:-main}
  env_file: .env
  restart: unless-stopped
  logging: *logging

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ciie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in /opt/klciie/.env}
      POSTGRES_DB: ${POSTGRES_DB:-ciie}
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  web:
    <<: *app
    command: ["sh", "bin/start-web.sh"]
    environment:
      # Built here so the password is written once, in .env. Keep it hex: it goes into a URL.
      DATABASE_URL: postgres://${POSTGRES_USER:-ciie}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ciie}
      RUN_MIGRATIONS: "1"
      RUN_WORKER_IN_WEB: "0"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ops/healthz/', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 120s

  worker:
    <<: *app
    command: ["sh", "bin/start-worker.sh"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ciie}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ciie}
      RUN_MIGRATIONS: "0"
    volumes:
      # rclone.conf for the backup remotes (Google Drive, OneDrive). rclone refreshes its
      # tokens in this file, so the folder is writable and owned by the image's user (10001).
      - ./rclone:/home/app/.config/rclone
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # ":80" serves plain HTTP on the server's IP; a domain name turns on automatic HTTPS.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
