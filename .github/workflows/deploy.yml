# Test, build the Docker image, push it to GitHub Container Registry and deploy it to the
# EC2 server. Runs on every push to main; the deploy step only runs when the tests pass.
#
# Rollback: Actions, then deploy, then "Run workflow" with an older commit's full sha as the
# tag. That redeploys the image already built for that commit, without testing or building.
#
# Repository variables: AWS_ROLE_ARN, AWS_REGION and EC2_INSTANCE_ID.
# Until EC2_INSTANCE_ID is set, the workflow tests and builds the image but skips the deploy.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to redeploy (a full commit sha). Leave empty to test, build and deploy this commit."
        required: false
        default: ""

# One deploy at a time, in order; a running deploy is never cancelled halfway.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    if: github.ref == 'refs/heads/main' && !inputs.tag
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name (GHCR needs lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [test, build]
    # After a green build, or straight away for a rollback tag. Skipped until the server exists.
    if: >-
      always() && github.ref == 'refs/heads/main' && vars.EC2_INSTANCE_ID != '' &&
      (needs.build.result == 'success' || (inputs.tag != '' && needs.build.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy through AWS Systems Manager
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          TAG: ${{ inputs.tag || github.sha }}
        run: bash deploy/ssm-deploy.sh
